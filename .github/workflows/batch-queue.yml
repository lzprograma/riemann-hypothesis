name: batch queue

# A maintainer or reviewer queues a pull request for a batch build by commenting `batch`, or just
# `b`, on it.
# This records the commit that was the pull request's head when the comment was posted, and adds
# the `batch queue` label. `batch <commit>`, with the full id of the head commit, names the commit
# outright. The label on its own queues nothing, and the approval covers that commit only: a
# commit pushed later is not approved until someone comments `batch` again. Commenting `p`, or
# `p <commit>`, queues a pull request the way `batch` does and labels it `priority` as well.
#
# The batch queue is a list of approvals: maintainers assemble batches from it by hand. The sync
# job used to assemble a batch of its own from the queue as well, a `batch/<date-time>` branch
# with its own pull request. That code is kept in `scripts/batch-queue-sync.py`, switched off by
# `ASSEMBLE`, in case we want a batch assembled by the queue again; the comment there says what
# we learned. In short: GitHub Actions may not create pull requests in this repository, so the
# queue's batch never got one and every sync run failed; the batches assembled by hand already
# take every open pull request that is not a draft, touches `src/` and merges cleanly, queued or
# not; they are stacked, so a batch of the queue would have to follow the outermost one, which it
# now does; and a run that assembled cost about 300 requests. To revive it, allow GitHub Actions
# to create pull requests and turn `ASSEMBLE` back on.
#
# Commenting `-batch` takes a pull request out of the queue again: it withdraws the recorded
# commit and removes the `batch queue` label, and nothing else. Commits already merged into a
# batch stay there, and no batch is rebuilt, so a build that is under way is never disturbed.
#
# Commenting `aa` hands a pull request back to its author: it adds the `awaiting-author` label and
# nothing else. The inbox workflow takes a pull request with that label out of the inbox.
#
# Commenting `d` defers a pull request: it adds the `deferred` label and nothing else. A pull
# request with that label should not be merged for now, and batches leave it out (see AGENTS.md).
#
# Commenting `ready` hands it back to the maintainers: it takes `awaiting-author` off and nothing
# else. The pull request's author can do this as well as maintainers. The inbox workflow counts
# the label coming off as the pull request entering review again, and this workflow starts it for
# that pull request, so it goes back in the inbox within a minute or so. Without the label there
# is nothing to take off, and `ready` does nothing.
#
# A pull request that is closed, merged or not, loses `batch queue` and `building`. Reopened, it
# gets `batch queue` back if this workflow took the label off and nobody commented `-batch` on
# it meanwhile. A label a person took off stays off.
#
# A batch assembled by hand is a `batch/...` branch of this repository under another name than
# the sync's own, such as `batch/b10b-on-1410`. It is never added to and its text is not
# rewritten. While its pull request is open, the sync job labels `building` each open pull
# request whose head commit is in that branch, queued or not, and records them in a comment
# there. The batch's own pull request gets `building` too. When it is merged, they lose
# `building`. When it is closed without being merged, they lose it too, and the ones that were
# queued go back to `batch queue`. The sync job runs when that pull request is opened, edited,
# pushed to, closed or reopened. A pull request labelled `batch queue` that holds a batch like
# this waits in the queue like any other.
#
# Batches assembled by hand can be stacked: the upper batch's branch merges the lower one's, and
# it lands right after it. A batch says which one it is stacked on in its description, with a line
# such as `- [ ] depends on: #1739`, ticked or not. Until it has one naming an open batch, its
# branch name says so instead: `batch/<anything>-on-<number>`. A pull request in several batches
# of a stack belongs to the lowest, and is recorded there only; no pull request that holds a batch
# is ever part of another. The outermost batch of each stack, the one no other batch is stacked
# on, is labelled `latest batch` too, until another batch is stacked on it or it closes. When a
# batch is closed without being merged, each batch stacked on it is told once in a comment: its
# branch still carries the closed batch's commits, whose pull requests are now its own and stay
# `building`, and it should be rebuilt and its `depends on` line or branch name updated. If a
# batch stacked on it cannot be looked through in that run, the closed batch's pull requests keep
# their labels, and the next run settles them.
#
# Only a comment whose whole text is one of these counts, letter case and surrounding blank space
# aside: `batch` or `b`, `batch <commit>` or `b <commit>`, `p` and `p <commit>`, `-batch` or
# `-b`, `aa`, `d` and `ready`.
# Each of them needs triage access to this repository or more, except that the pull request's
# author can comment `ready` too. Reviewers are the people given the Triage role: it lets them
# queue pull requests and hand them back without write access. Every other comment is ignored.
# GitHub runs this workflow from the default branch for every event below, so a pull request
# cannot change what it does. Nothing from a pull request is checked out or run: the sync goes
# through GitHub's API, and comparisons read git objects only.
#
# Queuing also compares the pull request with the others labelled `building` or `batch queue`
# and comments if git cannot merge it with one of them, or if one deletes a Lean file the other
# starts to import. That job only reports.
#
# The workflow can be started by hand to bring the labels up to date, with a pull request number
# to repeat the comparison for that pull request.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, synchronize, closed, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to compare with the rest of the batch queue (optional)
        type: number
        required: false

permissions: {}

jobs:
  label:
    name: Act on a `batch`, `p`, `-batch`, `aa`, `d` or `ready` comment
    # A first filter, so that most comments start no runner: pull requests only, and the comment
    # has to contain one of the words. `b`, `p`, `-b`, `aa` and `d` are too short to look for
    # anywhere in a comment, and `ready` too common, so they are only noticed at its very start.
    # startsWith ignores letter case. The step below makes the exact comparison.
    if: >-
      ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          (contains(github.event.comment.body, 'batch') ||
           startsWith(github.event.comment.body, 'b') || startsWith(github.event.comment.body, '-b') ||
           startsWith(github.event.comment.body, 'p') || startsWith(github.event.comment.body, 'd') ||
           startsWith(github.event.comment.body, 'aa') || startsWith(github.event.comment.body, 'ready')) }}
    runs-on: ubuntu-latest
    # `contents: read` is for the log of pushes to a branch of this repository, and
    # `actions: write` for starting the inbox workflow after `ready`.
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    outputs:
      queued: ${{ steps.label.outputs.queued }}
      unqueued: ${{ steps.label.outputs.unqueued }}
    steps:
      - name: Check the comment and its author, then add the label
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
          OPENER: ${{ github.event.issue.user.login }}
          BODY: ${{ github.event.comment.body }}
          WHEN: ${{ github.event.comment.created_at }}
          LABEL: batch queue
          PRIORITY: priority
          WAITING: awaiting-author
          DEFERRED: deferred
        run: |
          # The comment text arrives in an environment variable. It is compared and never run.
          text=$(printf '%s' "$BODY" | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          # Drop blank space, line breaks included, from both ends.
          text="${text#"${text%%[![:space:]]*}"}"
          text="${text%"${text##*[![:space:]]}"}"
          # `batch <commit>` names the commit to queue. `p` queues like `batch` and also adds the
          # `priority` label. `again` is the word to repeat in a help comment.
          named=''
          with_commit='^(batch|b|p)[[:space:]]+([0-9a-f]{7,40})$'
          if [[ "$text" =~ $with_commit ]]; then
            named=${BASH_REMATCH[2]}
            text=${BASH_REMATCH[1]}
          fi
          priority=''
          again=batch
          case "$text" in
            b) text=batch ;;
            p) text=batch priority=yes again=p ;;
            -b) text=-batch ;;
          esac
          case "$text" in
            batch | -batch | aa | d | ready) ;;
            *)
              echo "The comment is not just 'batch', 'p', '-batch', 'aa', 'd' or 'ready', or 'b' or '-b': nothing to do."
              exit 0
              ;;
          esac

          # Triage access or higher. The API reports the maintain role as write and triage as read
          # under `permission`, so triage is told apart by `role_name`. The pull request's author
          # may comment `ready` whatever their access.
          if [ "$text" = ready ] && [ "$AUTHOR" = "$OPENER" ]; then
            permission=author
            role=''
          else
            if ! access=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq '.permission + " " + (.role_name // "")'); then
              echo "::error::Could not read the access $AUTHOR has to $REPO."
              exit 1
            fi
            read -r permission role <<< "$access"
          fi
          case "$permission" in
            admin | write | author) ;;
            *)
              if [ "$role" = triage ]; then
                :
              elif [ "$text" = aa ]; then
                echo "$AUTHOR has '${role:-$permission}' access. Labelling a pull request '$WAITING' needs triage access."
                exit 0
              elif [ "$text" = d ]; then
                echo "$AUTHOR has '${role:-$permission}' access. Labelling a pull request '$DEFERRED' needs triage access."
                exit 0
              elif [ "$text" = ready ]; then
                echo "$AUTHOR did not open pull request $PR and has '${role:-$permission}' access. Taking '$WAITING' off someone else's pull request needs triage access."
                exit 0
              else
                echo "$AUTHOR has '${role:-$permission}' access. Queuing or unqueuing needs triage access."
                exit 0
              fi
              ;;
          esac

          say() {
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f "body=$1" --silent
          }

          if [ "$text" = aa ]; then
            # Back to the author. The label is all this does. Adding a label that does not exist
            # creates it, so a renamed `awaiting-author` should fail here instead.
            if ! gh api "repos/$REPO/labels/$(jq -rn --arg label "$WAITING" '$label | @uri')" --silent; then
              echo "::error::There is no '$WAITING' label in $REPO. Was it renamed?"
              exit 1
            fi
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$WAITING" --silent
            echo "Added '$WAITING' to pull request $PR, as $AUTHOR asked."
            exit 0
          fi

          if [ "$text" = d ]; then
            # Not to be merged for now. As with `aa`, the label is all this does, and a renamed
            # `deferred` should fail here instead of starting a second label.
            if ! gh api "repos/$REPO/labels/$(jq -rn --arg label "$DEFERRED" '$label | @uri')" --silent; then
              echo "::error::There is no '$DEFERRED' label in $REPO. Was it renamed?"
              exit 1
            fi
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$DEFERRED" --silent
            echo "Added '$DEFERRED' to pull request $PR, as $AUTHOR asked."
            exit 0
          fi

          if [ "$text" = ready ]; then
            # Back to the maintainers. The inbox workflow counts the label coming off as the pull
            # request entering review again. A label change made with this job's token starts no
            # run of it, so this asks for one.
            if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qxF -- "$WAITING"; then
              gh api -X DELETE "repos/$REPO/issues/$PR/labels/$(jq -rn --arg label "$WAITING" '$label | @uri')" --silent
              echo "Removed '$WAITING' from pull request $PR, as $AUTHOR asked."
              if ! gh workflow run inbox.yml --repo "$REPO" -f "pr=$PR"; then
                echo "::warning::Could not start the inbox workflow for pull request $PR."
              fi
            else
              echo "Pull request $PR does not carry '$WAITING': nothing to do."
            fi
            exit 0
          fi

          if [ "$text" = -batch ]; then
            # Out of the queue: the queued commit is withdrawn and the label goes. Commits already
            # merged into a batch stay there, so no batch is rebuilt and no build is disturbed.
            # The withdrawal is recorded first, and whether or not the label is still there, so
            # that putting the label back by hand queues nothing.
            say "$(printf '<!-- batch-queue-withdrawn -->\nTaken out of the batch queue by `%s`.' "$AUTHOR")"
            if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qxF -- "$LABEL"; then
              gh api -X DELETE "repos/$REPO/issues/$PR/labels/$(jq -rn --arg label "$LABEL" '$label | @uri')" --silent
              echo "Removed '$LABEL' from pull request $PR, as $AUTHOR asked."
            else
              echo "Pull request $PR does not carry '$LABEL'. The withdrawal is recorded all the same."
            fi
            echo "unqueued=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Adding a label that does not exist creates it. If `batch queue` is ever renamed, this
          # should fail and be noticed, not start a second label.
          if ! gh api "repos/$REPO/labels/$(jq -rn --arg label "$LABEL" '$label | @uri')" --silent; then
            echo "::error::There is no '$LABEL' label in $REPO. Was it renamed?"
            exit 1
          fi
          if [ -n "$priority" ] && ! gh api "repos/$REPO/labels/$(jq -rn --arg label "$PRIORITY" '$label | @uri')" --silent; then
            echo "::error::There is no '$PRIORITY' label in $REPO. Was it renamed?"
            exit 1
          fi

          # The pull request's head now, and the repository and branch it comes from.
          {
            read -r head
            read -r home
            read -r branch
          } < <(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha, (.head.repo.full_name // ""), .head.ref')
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the head commit of pull request $PR."
            exit 1
          fi

          # The commit to queue is the one the maintainer was looking at, not the head as this job
          # finds it. The job starts some time after the comment, and the author is told about the
          # comment, so a push made in between would otherwise pass as approved.
          if [ -n "$named" ]; then
            if [ "${#named}" -lt 40 ]; then
              say "$(printf '<!-- batch-queue-help -->\nNothing was queued. `%s <commit>` needs the full 40-character commit id, because another commit can be made to share a shorter one. The head of this pull request is now:\n\n```\n%s %s\n```' "$again" "$again" "$head")"
              echo "A short commit id was given: nothing queued."
              exit 0
            fi
            if [ "$named" != "$head" ]; then
              say "$(printf '<!-- batch-queue-help -->\nNothing was queued. `%s` is not the head of this pull request, which is now `%s`.' "$named" "$head")"
              echo "$named is not the head of pull request $PR: nothing queued."
              exit 0
            fi
            commit=$named
            why=$(printf 'the commit `%s` named' "$AUTHOR")
          else
            # The head as it was when the comment was posted, read from GitHub's log of pushes to
            # the branch: the newest push before the comment. The times in that log are GitHub's
            # own. Commit dates would not do, because the author sets them. A push in the same
            # second as the comment counts as after it.
            commit=''
            if [ -n "$home" ]; then
              pushes="repos/$home/activity?per_page=100&ref=$(jq -rn --arg ref "refs/heads/$branch" '$ref | @uri')"
              commit=$(gh api "$pushes" | jq -r --arg when "$WHEN" 'map(select(.timestamp < $when)) | first | .after // empty') || commit=''
            fi
            why=$(printf 'the head of this pull request when `%s` commented' "$AUTHOR")
            if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              say "$(printf '<!-- batch-queue-help -->\nNothing was queued. GitHub'"'"'s log of pushes to this branch did not show which commit was the head when you commented. Name the commit to queue. The head is now:\n\n```\n%s %s\n```' "$again" "$head")"
              echo "Could not tell which commit was the head of pull request $PR at $WHEN: nothing queued."
              exit 0
            fi
          fi

          # The record first and the label second, so that a run which sees the label also sees
          # the record. The sync job trusts the record only at the start of a comment written by
          # this workflow.
          say "$(printf '<!-- batch-queue-approved %s -->\nApproved for batching at `%s`, %s.' "$commit" "$commit" "$why")"
          echo "Recorded $commit as the queued commit."
          # Both labels in one request, so the sync job never sees the pull request queued
          # without its `priority`.
          labels=(-f "labels[]=$LABEL")
          if [ -n "$priority" ]; then
            labels+=(-f "labels[]=$PRIORITY")
          fi
          gh api -X POST "repos/$REPO/issues/$PR/labels" "${labels[@]}" --silent
          echo "Added '$LABEL'${priority:+ and '$PRIORITY'} to pull request $PR, as $AUTHOR asked."
          echo "queued=true" >> "$GITHUB_OUTPUT"

  conflicts:
    name: Compare with the other queued pull requests
    needs: label
    # After the label job has just queued the pull request, or when started by hand with a pull
    # request number. `always()` is needed for the second case, where the label job is skipped.
    if: >-
      ${{ always() && (needs.label.outputs.queued == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.pr_number)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out this workflow's own copy of the scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      # Pull request commits are fetched as git objects and compared with `git merge-tree`.
      # No pull request file is checked out or run.
      - name: Report conflicts with the rest of the queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || inputs.pr_number }}
        run: python3 scripts/batch-queue-conflicts.py --repo "$REPO" --pr "$PR" --comment --summary "$GITHUB_STEP_SUMMARY"

  reopened:
    name: Put `batch queue` back on a reopened pull request
    # The label comes back only if this workflow took it off when the pull request was closed,
    # and nobody commented `-batch` meanwhile. The script decides; this only starts it.
    if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'reopened' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      restored: ${{ steps.reopened.outputs.restored }}
    steps:
      - name: Check out this workflow's own copy of the scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      # Reads the pull request's labels, events and comments through the API. Nothing from the
      # pull request is checked out or run.
      - name: Put the label back if this workflow took it off
        id: reopened
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          said=$(python3 scripts/batch-queue-sync.py --repo "$REPO" --reopened "$PR" --summary "$GITHUB_STEP_SUMMARY")
          printf '%s\n' "$said"
          if printf '%s\n' "$said" | grep -qF "#$PR was reopened:"; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    name: Keep the labels in step with the batches
    needs: [label, reopened]
    # After a pull request was queued, unqueued or given its label back, after a batch was
    # opened, edited (a new `depends on` line changes the order of stacked batches), pushed to,
    # merged or closed, after a labelled pull request was closed, or when
    # started by hand. Tidying up does not depend on the `pull_request_target` event: every run
    # does it, so it only happens sooner with the event.
    if: >-
      ${{ always() && (
          github.event_name == 'workflow_dispatch' ||
          needs.label.outputs.queued == 'true' || needs.label.outputs.unqueued == 'true' ||
          needs.reopened.outputs.restored == 'true' ||
          (github.event_name == 'pull_request_target' &&
           ((startsWith(github.event.pull_request.head.ref, 'batch/') &&
             github.event.pull_request.head.repo.full_name == github.repository) ||
            (github.event.action == 'closed' &&
             (contains(github.event.pull_request.labels.*.name, 'batch queue') ||
              contains(github.event.pull_request.labels.*.name, 'building')))))) }}
    runs-on: ubuntu-latest
    # One run at a time. A run still waiting when a newer one arrives can be dropped, and that
    # loses nothing: each run works from what GitHub shows now, not from what started it.
    concurrency:
      group: batch-queue-sync
      cancel-in-progress: false
    # `contents: write` to remove the branch of a batch the sync started once its pull request is
    # merged or closed, and, with `ASSEMBLE` on, to create batch branches and merge into them.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out this workflow's own copy of the scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # No `ref`: the default is the commit GitHub runs this workflow from. When a pull request
        # from a fork is merged, that commit is also its merge commit, and checkout refuses it
        # when it is passed as `ref`.
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # Everything goes through GitHub's API. No pull request file is checked out or run.
      - name: Keep the labels in step and tidy up after batches that are finished with
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/batch-queue-sync.py --repo "$REPO" --summary "$GITHUB_STEP_SUMMARY"
